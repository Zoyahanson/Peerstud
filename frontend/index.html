<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeerStud Auth</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <h1>PeerStud Authentication</h1>
    <section class="card">
      <h2>Email/Password</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div class="row">
        <button id="signupBtn">Sign up</button>
        <button id="loginBtn">Login</button>
      </div>
    </section>

    <section class="card">
      <h2>Google OAuth</h2>
      <button id="googleBtn">Continue with Google</button>
    </section>

    <section class="card">
      <h2>Google Calendar Link</h2>
      <p id="calendarStatus">Calendar not linked.</p>
      <div class="row">
        <button id="linkCalendarBtn">Link Google Calendar</button>
        <button id="unlinkCalendarBtn">Unlink Calendar</button>
      </div>
    </section>

    <section class="card">
      <h2>Session</h2>
      <p id="sessionInfo">Not authenticated.</p>
      <div class="row">
        <button id="whoamiBtn">Call /users/me</button>
        <button id="logoutBtn">Logout</button>
      </div>
      <pre id="output"></pre>
    </section>
  </main>

  <script src="./firebase-config.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>

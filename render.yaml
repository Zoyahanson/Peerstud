services:
  - type: web
    name: peerstud-backend
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SCHOOL_EMAIL_DOMAINS
        value: mymona.uwi.edu,uwi.edu.jm
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: 1

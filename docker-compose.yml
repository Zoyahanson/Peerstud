services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: peerstud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: peerstud
      POSTGRES_USER: peerstud
      POSTGRES_PASSWORD: peerstud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
